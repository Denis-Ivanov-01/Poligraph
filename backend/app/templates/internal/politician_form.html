{% extends "internal/base.html" %}
{% block content %}
<h2>{{ form_title }}</h2>
<form method="post" action="{{ form_action }}" class="stack">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label>Slug <input name="slug" value="{{ politician.slug if politician else '' }}" required></label>
  <label>Full name <input name="full_name" value="{{ politician.full_name if politician else '' }}" required></label>
  <label>Picture URL <input name="image_url" type="url" value="{{ politician.image_url if politician and politician.image_url else '' }}" placeholder="https://example.com/photo.jpg"></label>
  <label>Biography <textarea name="biography">{{ politician.biography if politician and politician.biography else '' }}</textarea></label>
  <label>Current party
    <select name="party_id">
      <option value="">None</option>
      {% for party in parties %}
        <option value="{{ party.id }}" {% if current_party_id == party.id|string %}selected{% endif %}>{{ party.full_name }}</option>
      {% endfor %}
    </select>
  </label>
  <button type="submit">{{ submit_label }}</button>
</form>
{% endblock %}
